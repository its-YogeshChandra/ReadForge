services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-readforge}
      POSTGRES_USER: ${POSTGRES_USER:-readforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-readforge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  minio:
    image: bitnami/minio@sha256:f651556c9adf011d17e3e1646079f34906ecce43aaf73deeafa08d7a25872db4
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET_NAME:-readforge-documents}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 15

  observability:
    image: grafana/otel-lgtm:0.31.0
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - observability_data:/data
      - ./observability/grafana/dashboard.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/readforge.yaml:ro
      - ./observability/grafana/readforge.json:/otel-lgtm/readforge-dashboard.json:ro
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  observability_data:
