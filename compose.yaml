services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-readforge}
      POSTGRES_USER: ${POSTGRES_USER:-readforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-readforge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  clip:
    image: ai4all/clip
    ports:
      - "${CLIP_PORT:-8082}:8000"
    volumes:
      - clip_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 60

volumes:
  postgres_data:
  clip_models:
