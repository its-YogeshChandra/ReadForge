[project]
name = "readforge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "its-YogeshChandra", email = "pandittheroyal@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14",
    "boto3>=1.43.103",
    "fastapi[standard]>=0.141.1",
    "google-cloud-documentai>=3.15.0",
    "google-cloud-storage>=3.15.0",
    "langchain>=1.4.3",
    "langgraph>=1.2.12",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pyobjc-framework-quartz>=12.2.2",
    "pyobjc-framework-vision>=12.2.2",
    "python-dotenv>=1.0.0",
    "redis>=8.1.0",
    "requests>=2.32",
    "sqlalchemy[asyncio]>=2.0",
]

[project.scripts]
readforge = "readforge:main"
readforge-ocr = "readforge.document_ai:main"
readforge-migrate = "readforge.database.migrations:main"
readforge-worker = "readforge.worker:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
